<!doctype html><meta charset="utf-8"><title>Лисья охота — джойстики</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Проверка управления «Лисьей охоты» без самой игры: http://localhost:8000/tools/fox-hunt-sticks.html
     Сцена с двумя джойстиками (games/fox-hunt/input.js) над цветной землёй, лиса-кружок ходит и прыгает по тому,
     что пришло из объекта ввода, сам объект — текстом сверху. Экран кладёт набок настоящий помощник оболочки
     (shell/landscape.js): в узком окне сцена повёрнута на 90°. Нет помощника — простая коробка.
       ?bg=forest|swamp|taiga|cave|autumn|split   земля под джойстиками (split — слева лес, справа пещера)
       ?lefty          режим левши          ?flip    положить экран на другой бок (только когда он повёрнут)
       ?action=fire|use|none                значок на ручке джойстика действия
       ?insets=верх,право,низ,лево          отступы устройства в px (часы, вырез, кнопки Telegram) — заштрихованы
       ?desktop        как на компьютере: экран не поворачивается
       ?plain          без помощника оболочки
       ?theme=dark|light                    тема (цвета джойстиков, пока палитра игры их не задала, — из неё)
       ?nui            цвета нового интерфейса (тёмный с жёлтыми кнопками)
       ?quiet          без текста сверху (для снимков)
     Сценарию проверки: window.__sticks — { input, sticks, n: { frames, dashes, acts, fires, pauses }, dash, fox,
     screen, land, api, snap() }. -->
<link rel="stylesheet" href="../styles/theme.css">
<link rel="stylesheet" href="../styles/app.css">
<link rel="stylesheet" href="../games/fox-hunt/game.css">
<style>
  /* каркас сцены — как в игре; из game.css сюда берётся только блок «стики» */
  .game-root[data-game="fox-hunt"] { display: flex; flex-direction: column; overflow: hidden; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .st-root { position: relative; flex: 1; min-height: 0; overflow: hidden; isolation: isolate; }
  .st-stage { position: absolute; inset: 0; }
  .st-canvas { display: block; position: absolute; left: 0; top: 0; }
  .st-text {
    position: absolute; left: 50%; top: calc(var(--ls-t, 0px) + 6px); translate: -50% 0; margin: 0; padding: 5px 9px; max-width: 62%;
    border-radius: 8px; background: rgba(0, 0, 0, 0.5); color: #fff; font: 11px/1.35 ui-monospace, Consolas, monospace;
    white-space: pre; pointer-events: none;
  }
</style>
<body>
<div id="app">
  <main class="screen" id="screen">
    <div class="scroll game-root" data-game="fox-hunt">
      <div class="fh st-root">
        <div class="fh-stage st-stage">
          <canvas class="fh-canvas st-canvas"></canvas>
          <div class="fh-sticks"></div>
        </div>
        <pre class="st-text" hidden></pre>
      </div>
    </div>
  </main>
</div>
<script type="module">
import { createInput, STICK } from '../games/fox-hunt/input.js';

const Q = new URLSearchParams(location.search);
if (Q.get('theme')) document.documentElement.dataset.theme = Q.get('theme');
if (Q.has('nui')) {
  document.head.append(Object.assign(document.createElement('link'), { rel: 'stylesheet', href: '../styles/nui.css' }));
  document.documentElement.classList.add('nui');
}

const GROUND = {            // земля мест игры: основа, светлое и тёмное пятно
  forest: ['#7cc45a', '#9ad96f', '#5ea646'],
  swamp: ['#6f9a6a', '#8db37f', '#4f7b58'],
  taiga: ['#e6eef6', '#ffffff', '#c2d2e4'],
  cave: ['#5a5868', '#6f6d80', '#454355'],
  autumn: ['#c98a3c', '#e0a650', '#a86a2c'],
};
const bg = Q.get('bg') || 'split';
const SPEED = 132;          // как у лисы в игре: единиц мира в секунду
const REACH = STICK.reach;

const screenEl = document.getElementById('screen');
const stage = document.querySelector('.fh-stage');
const canvas = document.querySelector('.fh-canvas');
const sticksEl = document.querySelector('.fh-sticks');
const text = document.querySelector('.st-text');
const ctx = canvas.getContext('2d');

// отступы устройства — их в настоящем приложении отдаёт Telegram
const device = { top: 0, right: 0, bottom: 0, left: 0 };
(Q.get('insets') || '').split(',').map(Number).forEach((v, i) => {
  if (Number.isFinite(v) && i < 4) device[['top', 'right', 'bottom', 'left'][i]] = v;
});
const platform = {
  isDesktop: Q.has('desktop'),
  insets: () => device,
  onInsets: () => () => {},
  onActivated: () => () => {},
  orientation: { supported: false, isLocked: false, lock() {}, unlock() {} },
};

let land = null;
let landNote = 'простая коробка (?plain)';
if (!Q.has('plain')) {
  try {
    const { createLandscape } = await import('../shell/landscape.js');
    land = createLandscape(screenEl, { platform, app: document.getElementById('app') });
    if (Q.has('flip')) land.api.flip(true);
    landNote = 'shell/landscape.js';
  } catch (err) {
    landNote = `помощника нет (${String(err.message).split('\n')[0]}) — простая коробка`;
  }
}
const screen = land?.api ?? null;

// мир проверки: единица мира — scale пикселей, как в игре (короткая сторона экрана — 320 единиц)
let W = 0;
let H = 0;
let scale = 1;
let ground = null;          // готовая картинка земли
const fox = { x: 0, y: 0, dir: 0, placed: false };
const trail = { on: 0, x1: 0, y1: 0, x2: 0, y2: 0 };
const n = { frames: 0, dashes: 0, acts: 0, fires: 0, pauses: 0 };
const dash = { dx: 0, dy: 0, dp: 0 };
let firing = false;

const toWorld = (x, y, out) => {
  out.x = x / scale;
  out.y = y / scale;
  return out;
};

const api = createInput({
  stage, sticksEl, screen, toWorld,
  onPause: () => { n.pauses += 1; },
  lefty: Q.has('lefty'),
});
api.setAction(Q.get('action') || 'fire');

function paintGround() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  ground = document.createElement('canvas');
  ground.width = canvas.width;
  ground.height = canvas.height;
  const g = ground.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const halves = bg === 'split' ? [['forest', 0, W / 2], ['cave', W / 2, W]] : [[GROUND[bg] ? bg : 'forest', 0, W]];
  let seed = 7;
  const rnd = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  for (const [name, x0, x1] of halves) {
    const [base, light, dark] = GROUND[name];
    g.save();
    g.beginPath();
    g.rect(x0, 0, x1 - x0, H);
    g.clip();
    g.fillStyle = base;
    g.fillRect(x0, 0, x1 - x0, H);
    for (let i = 0; i < 46; i++) {
      g.fillStyle = i % 2 ? light : dark;
      g.globalAlpha = 0.5;
      g.beginPath();
      g.ellipse(x0 + rnd() * (x1 - x0), rnd() * H, 18 + rnd() * 46, 10 + rnd() * 26, rnd() * 3, 0, Math.PI * 2);
      g.fill();
    }
    g.restore();
  }
  // куда кнопки ставить нельзя (часы, вырез, кнопки Telegram) — заштриховано
  const ins = screen ? screen.insets() : { top: 0, right: 0, bottom: 0, left: 0 };
  g.fillStyle = 'rgba(0, 0, 0, 0.35)';
  g.fillRect(0, 0, W, ins.top);
  g.fillRect(0, H - ins.bottom, W, ins.bottom);
  g.fillRect(0, 0, ins.left, H);
  g.fillRect(W - ins.right, 0, ins.right, H);
}

function resize() {
  const w = stage.offsetWidth;              // размеры вёрстки: у повёрнутой сцены рамка «стоячая»
  const h = stage.offsetHeight;
  if (!w || !h) return;
  W = w;
  H = h;
  scale = Math.min(W, H) / 320;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = `${W}px`;
  canvas.style.height = `${H}px`;
  if (!fox.placed) {
    fox.placed = true;
    fox.x = W / 2 / scale;
    fox.y = H / 2 / scale;
  }
  paintGround();
  api.resize();
}
new ResizeObserver(resize).observe(stage);
screen?.onChange(resize);
resize();

function draw() {
  const dpr = canvas.width / W;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (ground) ctx.drawImage(ground, 0, 0);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  const inp = api.state;
  if (trail.on > 0) {
    ctx.globalAlpha = Math.min(1, trail.on * 2);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(trail.x1, trail.y1);
    ctx.lineTo(trail.x2, trail.y2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (inp.aim) {
    // стрелка рывка — здесь попроще, чем нарисует рендер игры
    const len = REACH * (STICK.reachMin + (1 - STICK.reachMin) * inp.ap);
    const ex = fox.x + inp.ax * len;
    const ey = fox.y + inp.ay * len;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.setLineDash([2, 9]);
    ctx.beginPath();
    ctx.moveTo(fox.x, fox.y);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ex, ey, 6, 0, Math.PI * 2);
    ctx.fill();
  }
  if (inp.fire) {
    ctx.strokeStyle = '#ffe14d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(fox.x, fox.y, 18, 0, Math.PI * 2);
    ctx.stroke();
    if (inp.hasT) {
      ctx.beginPath();
      ctx.moveTo(inp.tx - 8, inp.ty);
      ctx.lineTo(inp.tx + 8, inp.ty);
      ctx.moveTo(inp.tx, inp.ty - 8);
      ctx.lineTo(inp.tx, inp.ty + 8);
      ctx.stroke();
    }
  }
  ctx.fillStyle = '#f0862b';
  ctx.strokeStyle = '#7a3d10';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(fox.x, fox.y, 11, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#fff1dc';
  ctx.beginPath();
  ctx.arc(fox.x + Math.cos(fox.dir) * 7, fox.y + Math.sin(fox.dir) * 7, 4, 0, Math.PI * 2);
  ctx.fill();
}

const f2 = (v) => (Math.abs(v) < 0.005 ? '0.00' : v.toFixed(2));
const yes = (v) => (v ? 'да' : 'нет');
function write() {
  const i = api.state;
  const s = api.sticks;
  const ins = screen ? screen.insets() : null;
  text.textContent = [
    `сцена ${W}×${H} · поворот ${screen ? screen.turn : '—'} · отступы ${ins ? `${ins.top} ${ins.right} ${ins.bottom} ${ins.left}` : '—'} · ${landNote}`,
    `mx ${f2(i.mx)}  my ${f2(i.my)} · fire ${yes(i.fire)} · hasT ${yes(i.hasT)} (${f2(i.tx)}, ${f2(i.ty)})`,
    `aim ${yes(i.aim)}  ax ${f2(i.ax)}  ay ${f2(i.ay)}  ap ${f2(i.ap)}`,
    `рывков ${n.dashes} (последний: ${f2(dash.dx)}, ${f2(dash.dy)}, сила ${f2(dash.dp)}) · действий ${n.acts} · огонь включали ${n.fires} · пауз ${n.pauses}`,
    `ходьба: ${s.move.state} (${Math.round(s.move.x)}, ${Math.round(s.move.y)}) · действие: ${s.act.state} (${Math.round(s.act.x)}, ${Math.round(s.act.y)})`,
  ].join('\n');
}
text.hidden = Q.has('quiet');

let lastTime = performance.now();
function loop(time) {
  const dt = Math.min(0.05, Math.max(0, (time - lastTime) / 1000));
  lastTime = time;
  const inp = api.frame(fox.x, fox.y, fox.dir, REACH);
  n.frames += 1;
  if (inp.fire && !firing) n.fires += 1;
  firing = inp.fire;
  if (inp.act) n.acts += 1;
  if (inp.mx || inp.my) {
    fox.x += inp.mx * SPEED * dt;
    fox.y += inp.my * SPEED * dt;
    fox.dir = Math.atan2(inp.my, inp.mx);
  }
  if (inp.aim) fox.dir = Math.atan2(inp.ay, inp.ax);
  if (inp.dash) {
    n.dashes += 1;
    dash.dx = inp.dx;
    dash.dy = inp.dy;
    dash.dp = inp.dp;
    const len = REACH * (STICK.reachMin + (1 - STICK.reachMin) * inp.dp);
    trail.on = 0.6;
    trail.x1 = fox.x;
    trail.y1 = fox.y;
    fox.x += inp.dx * len;
    fox.y += inp.dy * len;
    trail.x2 = fox.x;
    trail.y2 = fox.y;
    fox.dir = Math.atan2(inp.dy, inp.dx);
  }
  fox.x = Math.max(12, Math.min(W / scale - 12, fox.x));
  fox.y = Math.max(12, Math.min(H / scale - 12, fox.y));
  if (trail.on > 0) trail.on -= dt;
  draw();
  if (!text.hidden) write();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.__sticks = {
  input: api.state,
  sticks: api.sticks,
  n, dash, fox, api,
  land: Boolean(land),
  get screen() {
    return screen ? { turn: screen.turn, ...screen.size(), insets: screen.insets() } : null;
  },
  /** Всё разом, простыми значениями. */
  snap() {
    return {
      input: { ...api.state },
      move: { ...api.sticks.move },
      act: { ...api.sticks.act },
      n: { ...n },
      dash: { ...dash },
      fox: { x: fox.x, y: fox.y, dir: fox.dir },
      stage: { w: W, h: H, scale },
      screen: this.screen,
      land: Boolean(land),
      off: sticksEl.classList.contains('fh-sticks--off'),
    };
  },
};
document.title = 'готово';
</script>
</body>
