<!doctype html><meta charset="utf-8"><body style="margin:0">
<!-- Проверка надписей: http://localhost:8000/tools/text-audit.html?w=360 — каждая игра, всплывашка и окна
     статистики/настроек в iframe нужной ширины; в <pre> — надписи за экраном или обрезанные (иначе OK).
     Из Claude: msedge --headless --force-prefers-reduced-motion --virtual-time-budget=60000 --dump-dom <url> -->
<pre id="out"></pre>
<script type="module">
const W = +(new URLSearchParams(location.search).get('w') || 360);
const ids = ['flappy-burger', 'brick-blast', 'loop', 'connect-dots', 'mahjong', '2048', 'boggle', 'block-blast', 'sudoku', 'wordle', 'guess-number'];
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const log = [];
function audit(d, where) {
  const vw = d.documentElement.clientWidth;
  for (const e of d.querySelectorAll('body *')) {
    if (!e.childNodes.length || e.closest('svg') || e.closest('[hidden]')) continue;
    const hasText = [...e.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim());
    if (!hasText) continue;
    const cs = getComputedStyle(e);
    if (cs.visibility === 'hidden' || cs.display === 'none' || +cs.opacity === 0) continue;
    const r = e.getBoundingClientRect();
    if (!r.width) continue;
    const text = e.textContent.trim().slice(0, 50);
    if (r.right > vw + 0.5 || r.left < -0.5) log.push(`${where}: за экраном [${Math.round(r.left)}..${Math.round(r.right)}] «${text}»`);
    else if (e.scrollWidth > e.clientWidth + 1 && cs.overflowX !== 'visible') log.push(`${where}: обрезано ${e.scrollWidth}>${e.clientWidth} «${text}»`);
  }
}
for (const id of ids) {
  const f = document.createElement('iframe');
  f.style.cssText = `width:${W}px;height:640px;border:0`;
  f.src = `../index.html?theme=dark#/game/${id}`;
  document.body.append(f);
  await new Promise((r) => (f.onload = r));
  await wait(2500);
  const d = f.contentDocument;
  audit(d, id);
  const t = d.querySelector('.toast');
  if (t) {
    t.textContent = 'Новое: тоннели — сквозь них только прямо, и каждый надо пройти в обе стороны';
    t.classList.add('toast-show');
    await wait(300);
    audit(d, id + '/toast');
    t.classList.remove('toast-show');
  }
  for (const label of ['Статистика', 'Настройки', 'Statistics', 'Settings']) {
    const b = d.querySelector(`[aria-label="${label}"]`);
    if (!b) continue;
    b.click();
    await wait(700);
    audit(d, `${id}/${label}`);
    d.querySelector('[aria-label="Закрыть"], [aria-label="Close"]')?.click();
    await wait(400);
  }
  f.remove();
}
// меню
const f = document.createElement('iframe');
f.style.cssText = `width:${W}px;height:640px;border:0`;
f.src = '../index.html?theme=dark#/';
document.body.append(f);
await new Promise((r) => (f.onload = r));
await wait(1500);
audit(f.contentDocument, 'меню');
out.textContent = log.length ? log.join('\n') : 'OK';
</script>
