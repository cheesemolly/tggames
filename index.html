<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Игры</title>
  <!-- Политика безопасности (аудит 2026-09-27): скрипты — только свои и Telegram, запросы — только свои файлы и
       сервер аккаунтов. Если когда-нибудь пролезет чужой скрипт, он не сможет отправить данные входа наружу. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org; connect-src 'self' https://tggames-api.cheesemolly3.workers.dev; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:,">  <!-- пустая иконка: без неё браузер шумит 404 на /favicon.ico -->

  <!-- Внутри Telegram даёт window.Telegram.WebApp (тема, кнопка «Назад», initData с подписью).
       В обычном браузере скрипт тоже грузится, но initData пустая — адаптер включает заглушку. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/app.css">
  <!-- новый интерфейс (в бете new-ui): всё под html.nui, игрокам до релиза ничего не меняет -->
  <link rel="stylesheet" href="styles/nui.css">
  <!-- заставка загрузки — раньше оболочки: она на экране, когда Telegram убирает свой экран загрузки -->
  <script type="module" src="shell/splash.js"></script>
  <script type="module" src="shell/app.js"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
